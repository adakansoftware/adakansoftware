name: Security monitor

on:
  schedule:
    - cron: "17 */6 * * *"
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-monitor
  cancel-in-progress: true

jobs:
  live-health:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify production health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            --max-time 20 https://adakansoftware.com/api/health \
            | node -e '
                let body = "";
                process.stdin.setEncoding("utf8");
                process.stdin.on("data", chunk => { body += chunk; });
                process.stdin.on("end", () => {
                  const payload = JSON.parse(body);
                  if (payload.ok !== true || payload.status !== "ok") process.exit(1);
                });
              '

      - name: Verify security disclosure
        run: |
          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            --max-time 20 https://adakansoftware.com/.well-known/security.txt \
            | grep --fixed-strings "Contact: mailto:info@adakansoftware.com"

  weekly-code-audit:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 3 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Scan tracked files for secrets
        run: npm run test:secrets

      - name: Audit production dependencies
        run: npm run audit:production
