name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Secret scan
        run: npm run test:secrets

      - name: Audit production dependencies
        run: npm run audit:production

      - name: Unit and security regression tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Production security smoke tests
        run: npm run test:smoke:production

      - name: Request boundary smoke tests
        run: npm run test:smoke:boundaries
        env:
          ADMIN_EMAIL: smoke@example.com
          ADMIN_PASSWORD: smoke-only-password
          ADMIN_SESSION_SECRET: smoke-only-session-secret-at-least-32-characters

      - name: Smoke test routes
        run: npm run test:smoke
