name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Secret scan
        run: npm run test:secrets

      - name: Audit production dependencies
        run: npm run audit:production

      - name: Unit and security regression tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Production security smoke tests
        run: npm run test:smoke:production

      - name: Request boundary smoke tests
        run: npm run test:smoke:boundaries
        env:
          ADMIN_EMAIL: smoke@example.com
          ADMIN_PASSWORD_HASH: pbkdf2-sha256$100000$MDEyMzQ1Njc4OWFiY2RlZg$CQEF03iMraucElCfobodRqkaFY16F3mxFDIvP9WoJcs
          ADMIN_SESSION_SECRET: smoke-only-session-secret-at-least-32-characters
          RATE_LIMIT_HASH_SECRET: smoke-only-rate-limit-secret-at-least-32-characters
          CONTACT_DATA_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY

      - name: Smoke test routes
        run: npm run test:smoke
